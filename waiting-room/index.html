<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waiting room · Technocore Pulse</title>
  <meta name="description" content="Technocore waiting room: join a queue, see who’s waiting, get match hints, then finish in the official rooms." />
  <link rel="icon" href="../kibble/brand/technocore-mark-32.png?v=2" type="image/png" />
  <style>
    :root {
      --bg:#0a1128; --panel:#151d32; --ink:#f5f7fa; --muted:#a1a7ae;
      --faint:#5c6670; --line:#232a3e; --cyan:#00b4d8; --amber:#f4b942;
      --good:#32d74b; --warn:#ff453a;
    }
    *{box-sizing:border-box} html,body{margin:0;padding:0}
    body{
      font:15px/1.5 Inter,ui-sans-serif,system-ui,sans-serif;color:var(--ink);min-height:100vh;
      background:
        radial-gradient(900px 480px at 8% -8%, rgba(0,180,216,.12) 0%, transparent 55%),
        radial-gradient(700px 420px at 100% 0%, rgba(4,102,200,.14) 0%, transparent 50%),
        linear-gradient(180deg,#0c1530 0%, var(--bg) 42%, #070d1c 100%);
      background-attachment:fixed;
    }
    a{color:var(--cyan);text-decoration:none} a:hover{color:#3dc5e0}
    .wrap{max-width:980px;margin:0 auto;padding:20px 16px 56px}
    header{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
    .brand{display:flex;gap:12px;align-items:center}
    .brand h1{margin:0;font-size:1.25rem;font-weight:650;letter-spacing:-.02em}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:.88rem}
    .nav{display:flex;gap:8px;flex-wrap:wrap}
    .nav a{font-size:.8rem;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:6px 11px}
    .nav a:hover{color:var(--ink);border-color:var(--cyan)}

    .queues{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
    .queues button{
      font:inherit;cursor:pointer;border-radius:12px;padding:10px 14px;text-align:left;
      background:rgba(16,26,49,.7);border:1px solid var(--line);color:var(--ink);min-width:160px;
    }
    .queues button.on{border-color:var(--cyan);background:rgba(0,180,216,.1)}
    .queues button .t{font-weight:650;display:block}
    .queues button .s{font-size:.75rem;color:var(--muted);margin-top:2px}
    .queues button .n{font-size:.72rem;color:var(--cyan);margin-top:4px}

    .layout{display:grid;grid-template-columns:280px 1fr;gap:14px;align-items:start}
    @media(max-width:820px){.layout{grid-template-columns:1fr}}

    .rail,.main{
      background:linear-gradient(180deg,#1a243c 0%,var(--panel) 50%);
      border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    }
    .rail h2,.main h2{margin:0 0 10px;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
    .you-name{font-weight:650;font-size:1rem;margin-bottom:4px}
    .you-meta{color:var(--faint);font-size:.8rem;margin-bottom:10px}
    .chips{display:flex;flex-wrap:wrap;gap:5px}
    .chip{font-size:.72rem;font-family:ui-monospace,Menlo,monospace;border-radius:999px;padding:3px 8px;border:1px solid var(--line);color:var(--muted)}
    .chip.have{color:var(--cyan);border-color:rgba(0,180,216,.35);background:rgba(0,180,216,.08)}
    .chip.need{color:var(--warn);border-color:rgba(255,69,58,.35);background:rgba(255,69,58,.08)}
    .steps{margin:14px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
    .steps li{font-size:.82rem;color:var(--muted);padding-left:22px;position:relative}
    .steps li:before{content:attr(data-n);position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;
      background:#0f1628;border:1px solid var(--line);color:var(--cyan);font-size:.65rem;display:grid;place-items:center;font-weight:700}
    .cta{display:flex;flex-direction:column;gap:8px;margin-top:14px}
    .cta a{display:block;text-align:center;border-radius:10px;padding:10px 12px;font-size:.85rem;font-weight:600}
    .cta a.primary{background:rgba(0,180,216,.15);border:1px solid rgba(0,180,216,.45);color:var(--ink)}
    .cta a.ghost{border:1px solid var(--line);color:var(--muted)}

    .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .toolbar input{flex:1;min-width:160px;font:inherit;background:#0f1628;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
    .toolbar select{font:inherit;background:#0f1628;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
    .section{margin-bottom:16px}
    .section .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
    .section .head h3{margin:0;font-size:.95rem}
    .section .head span{font-size:.75rem;color:var(--faint)}

    .list{display:flex;flex-direction:column;gap:8px}
    .card{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;
      background:#101a31;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
    .card .title{font-weight:650}
    .card .sub{font-size:.78rem;color:var(--faint);margin-top:2px;word-break:break-all}
    .card .tags{display:flex;flex-wrap:wrap;gap:5px;grid-column:1/-1}
    .score{font-size:.78rem;font-weight:700;color:var(--good);white-space:nowrap}
    .score.muted{color:var(--faint);font-weight:500}
    .empty{color:var(--faint);font-size:.9rem;padding:16px;text-align:center;border:1px dashed var(--line);border-radius:12px}
    .meta{color:var(--faint);font-size:.75rem;margin:0 0 12px}
    footer{margin-top:22px;padding-top:16px;border-top:1px solid var(--line);color:var(--faint);font-size:.8rem;line-height:1.55}
    .err{color:var(--warn)}
    .soon{opacity:.75}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <img src="../kibble/brand/technocore-mark-64.png?v=2" width="40" height="40" alt="" />
        <div>
          <h1>Waiting room</h1>
          <p>Pick a queue → see who’s waiting → match → finish in Technocore.</p>
        </div>
      </div>
      <div class="nav">
        <a href="../">Pulse</a>
        <a href="../kibble/">Radar</a>
        <a href="../projects/">Projects</a>
      </div>
    </header>

    <div class="queues" id="queues"></div>
    <p class="meta" id="stamp">Loading…</p>

    <div class="layout" id="layout" hidden>
      <aside class="rail" id="rail"></aside>
      <section class="main">
        <div class="toolbar">
          <input id="q" placeholder="Search X handle, DID, or letter…" />
          <select id="sort">
            <option value="fit">Best fit for you</option>
            <option value="letters">Most letters</option>
            <option value="recent">Recently registered</option>
          </select>
        </div>
        <div class="section">
          <div class="head"><h3>Suggested for you</h3><span id="sugCount"></span></div>
          <div class="list" id="suggested"></div>
        </div>
        <div class="section">
          <div class="head"><h3>Everyone waiting</h3><span id="allCount"></span></div>
          <div class="list" id="everyone"></div>
        </div>
        <div class="section">
          <div class="head"><h3>Open calls</h3><span>from campaign · untrusted</span></div>
          <div class="list" id="calls"></div>
        </div>
      </section>
    </div>

    <div id="placeholder" class="empty" hidden></div>

    <footer>
      Mark by <a href="https://x.com/IamOloba_">@IamOloba_</a> · waiting room by
      <a href="https://technocore.chat/kv/did/b508f2b2df0b1adc">oblikhan-2046</a>.
      A matchmaking view — official rooms still decide acceptance.
      <div id="src" style="margin-top:6px"></div>
    </footer>
  </div>
  <script>
(function(){
  let data=null, boardId=null, sort="fit";
  const params=new URLSearchParams(location.search);
  if(params.get("board")) boardId=params.get("board");

  function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
  function shortDid(d){d=String(d||"");return d.startsWith("did:key:")?d.slice(8,16)+"…"+d.slice(-4):d.slice(0,18);}
  function handle(x){if(!x)return "";const m=String(x).match(/x\.com\/([^/?#]+)/i);return m?"@"+m[1]:"";}
  function fmtTs(ts){if(!ts)return "—";try{return new Date(ts).toLocaleString(undefined,{dateStyle:"medium",timeStyle:"short"});}catch{return ts;}}

  function board(){return (data.boards||[]).find(b=>b.id===boardId) || (data.boards||[])[0];}

  function fitScore(you, p){
    if(!you || !p || p.did===you.did) return {gain:0, gained:""};
    const need=new Set((you.missing||"").split("").filter(Boolean));
    const give=new Set((p.letters||"").split(""));
    const gained=[...need].filter(ch=>give.has(ch));
    return {gain:gained.length, gained:gained.join("")};
  }

  function personCard(p, you, opts={}){
    const h=handle(p.x_account_url)||"no X";
    const fit=fitScore(you,p);
    const isYou=you && p.did===you.did;
    const tags=[];
    if(isYou) tags.push(`<span class="chip have">you</span>`);
    if(opts.showFit && fit.gain) tags.push(`<span class="chip have">+${esc(fit.gained)}</span>`);
    if(p.missing) tags.push(`<span class="chip need">need ${esc(p.missing)}</span>`);
    else tags.push(`<span class="chip have">full alphabet</span>`);
    tags.push(`<span class="chip">${p.letter_count||0} letters</span>`);
    const score = opts.showFit
      ? (fit.gain?`<div class="score">+${fit.gain}</div>`:`<div class="score muted">—</div>`)
      : `<div class="score muted">${p.letter_count||0}</div>`;
    const link = p.x_account_url?`<a href="${esc(p.x_account_url)}" rel="noopener">${esc(h)}</a>`:esc(h);
    return `<article class="card">
      <div><div class="title">${link}</div><div class="sub">${esc(shortDid(p.did))}</div></div>
      ${score}
      <div class="tags">${tags.join("")}</div>
    </article>`;
  }

  function renderQueues(){
    document.getElementById("queues").innerHTML=(data.boards||[]).map(b=>{
      const on=b.id===board().id?"on":"";
      const n=b.status==="soon"?"Coming soon":`${(b.counts&&b.counts.waiting)||0} waiting`;
      return `<button type="button" class="${on}" data-board="${esc(b.id)}">
        <span class="t">${esc(b.title)}</span>
        <span class="s">${esc(b.subtitle||"")}</span>
        <span class="n">${esc(n)}</span>
      </button>`;
    }).join("");
  }

  function render(){
    const b=board();
    if(!b) return;
    boardId=b.id;
    history.replaceState(null,"",`?board=${encodeURIComponent(boardId)}`);
    document.getElementById("stamp").textContent =
      `Updated ${fmtTs(data.as_of)}` + (b.closes?` · closes ${fmtTs(b.closes)}`:"");

    renderQueues();

    if(b.kind==="placeholder" || b.status==="soon"){
      document.getElementById("layout").hidden=true;
      const ph=document.getElementById("placeholder");
      ph.hidden=false;
      ph.innerHTML=`<strong>${esc(b.title)}</strong><br>${esc(b.subtitle||"")}<br><br>${(b.howto||[]).map(esc).join("<br>")}`;
      return;
    }
    document.getElementById("placeholder").hidden=true;
    document.getElementById("layout").hidden=false;

    const you=b.you || (b.people||[]).find(p=>p.did===b.focus_did);
    const need=(you&&you.missing?you.missing.split(""):[]);
    const have=(you&&you.letters?you.letters.split(""):[]);
    document.getElementById("rail").innerHTML=`
      <h2>You</h2>
      <div class="you-name">${esc(handle(you&&you.x_account_url)||"Not in this queue")}</div>
      <div class="you-meta">${you?`${you.letter_count}/26 letters · ${esc(shortDid(you.did))}`:"Register in the official room first."}</div>
      <div class="chips">
        ${need.length?need.map(ch=>`<span class="chip need">${esc(ch)}</span>`).join(""):`<span class="chip have">no gaps</span>`}
      </div>
      <ol class="steps">
        ${(b.howto||[]).map((t,i)=>`<li data-n="${i+1}">${esc(t)}</li>`).join("")}
      </ol>
      <div class="cta">
        ${(b.rooms&&b.rooms.campaign)?`<a class="primary" href="${esc(b.rooms.campaign)}" rel="noopener">Open campaign</a>`:""}
        ${(b.rooms&&b.rooms.discovery)?`<a class="ghost" href="${esc(b.rooms.discovery)}" rel="noopener">Discovery / team request</a>`:""}
        ${b.rules_url?`<a class="ghost" href="${esc(b.rules_url)}" rel="noopener">Rules</a>`:""}
      </div>`;

    const q=(document.getElementById("q").value||"").trim().toLowerCase();
    let people=[...(b.people||[])].filter(p=>!you || p.did!==you.did);
    if(q){
      people=people.filter(p=>
        (p.did||"").toLowerCase().includes(q) ||
        (p.x_account_url||"").toLowerCase().includes(q) ||
        (p.missing||"").includes(q) ||
        (p.letters||"").includes(q)
      );
    }
    const scored=people.map(p=>({p, fit:fitScore(you,p)}));
    if(sort==="fit") scored.sort((a,b)=>b.fit.gain-a.fit.gain || b.p.letter_count-a.p.letter_count);
    else if(sort==="letters") scored.sort((a,b)=>b.p.letter_count-a.p.letter_count);
    else scored.sort((a,b)=>(b.p.seq||0)-(a.p.seq||0));

    const suggested=scored.filter(x=>x.fit.gain>0).slice(0,8);
    document.getElementById("sugCount").textContent=suggested.length?`${suggested.length} shown`:"";
    document.getElementById("suggested").innerHTML=suggested.length
      ? suggested.map(x=>personCard(x.p,you,{showFit:true})).join("")
      : `<div class="empty">No complementary matches in this snapshot.</div>`;

    document.getElementById("allCount").textContent=`${scored.length} people`;
    document.getElementById("everyone").innerHTML=scored.slice(0,40).map(x=>personCard(x.p,you,{showFit:sort==="fit"})).join("")
      || `<div class="empty">Nobody in this queue yet.</div>`;

    const calls=b.lfg||[];
    document.getElementById("calls").innerHTML=calls.length?calls.slice().reverse().slice(0,12).map(m=>`
      <article class="card">
        <div><div class="title">${esc(shortDid(m.from))}</div><div class="sub">seq ${esc(m.seq)} · ${esc(fmtTs(m.ts))}</div></div>
        <div class="score muted">LFG</div>
        <div class="tags"><span class="chip">${esc((m.text||"").slice(0,160))}</span></div>
      </article>`).join(""):`<div class="empty">No open calls in the latest window.</div>`;
  }

  document.getElementById("queues").addEventListener("click",e=>{
    const b=e.target.closest("button[data-board]"); if(!b) return;
    boardId=b.getAttribute("data-board"); render();
  });
  document.getElementById("q").addEventListener("input",()=>render());
  document.getElementById("sort").addEventListener("change",e=>{sort=e.target.value; render();});

  async function load(){
    const r=await fetch("live.json?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("live.json "+r.status);
    data=await r.json();
    if(!boardId) boardId=(data.boards&&data.boards[0]&&data.boards[0].id)||null;
    render();
    document.getElementById("src").textContent="Source: live.json snapshot · hourly refresh while contests are open";
  }
  load().catch(e=>{
    document.getElementById("stamp").innerHTML=`<span class="err">Failed: ${esc(e.message)}</span>`;
  });
})();
  </script>
</body>
</html>
